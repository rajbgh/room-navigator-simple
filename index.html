<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Room Status</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #111827;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    #workspaceName {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    #connectionStatus {
      position: fixed;
      bottom: 1.25rem;
      left: 0;
      width: 100%;
      color: #9ca3af;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <div id="workspaceName">Loading workspace...</div>
    <div id="connectionStatus">Connecting to room device...</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
